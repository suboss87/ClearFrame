<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clearframe</title>
    <!-- Tailwind utility classes used by the components, no build step needed -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #020617; }
      /* Thin scrollbar that blends into the dark UI instead of the chunky default */
      .cf-scroll { scrollbar-width: thin; scrollbar-color: #1e293b transparent; }
      .cf-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
      .cf-scroll::-webkit-scrollbar-track { background: transparent; }
      .cf-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
      .cf-scroll::-webkit-scrollbar-thumb:hover { background: #2b3b57; background-clip: content-box; }
      .cf-scroll::-webkit-scrollbar-corner { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
